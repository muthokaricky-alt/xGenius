# Weekly: re-run the walk-forward backtest so the site's model-performance page
# includes this season's latest matches.
name: Weekly backtest

on:
  schedule:
    - cron: "40 5 * * 1"   # Mondays 05:40 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v6
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Ingest
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m predictor.ingest

      - name: Backtest
        run: python -m predictor.backtest

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/performance.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: weekly backtest $(date -u +'%Y-%m-%d') UTC"
          git pull --rebase
          git push
